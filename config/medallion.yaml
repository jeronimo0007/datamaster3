# Convenção Medallion — mesma em Docker, Azure e AWS
# Paths: {base}/layer/entity — src/data_architecture/medallion.py

layers:
  landing:
    description: "Aterrissagem multi-formato (JSON, CSV, Parquet, XML)"
    default_entity: "transactions"
  bronze:
    description: "Parquet fiel à origem"
    default_entity: "transactions"
  silver:
    description: "Limpeza, dedup, enriquecimento + DQ"
    default_entity: "transactions"
  gold:
    description: "Features / consumo ML e BI"
    default_entity: "transactions_ml"

orchestration:
  tool: "Apache Airflow"
  dags:
    - ingest_multi_source
    - medallion_pipeline
    - datamaster_e2e

stack:
  streaming: "Kafka"
  nosql: "MongoDB"
  processing: "Spark"
  note: "Mesmos componentes no local e na nuvem — sem substitutos"
