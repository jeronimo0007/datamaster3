# Terraform Azure — somente merge/push na branch `azure`.
# Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, TF_VAR_db_admin_password
# Opcional: TF_VAR_enable_analytics_stack=false para omitir Databricks/Synapse/AML (mais barato).
name: Deploy → Azure (Terraform)

on:
  push:
    branches: [azure]
  workflow_dispatch:
    inputs:
      terraform_dir:
        description: "Diretorio Terraform"
        required: true
        default: infrastructure/terraform/apresentacao
      enable_analytics_stack:
        description: "Databricks + Synapse + AML (custo alto)"
        type: boolean
        default: true

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_DIR: ${{ github.event.inputs.terraform_dir || 'infrastructure/terraform/apresentacao' }}
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_db_admin_password }}
      TF_VAR_analytics_high_cost_acknowledged: "true"
      # Precisam ser Repository secrets (Settings → Secrets → Actions), NAO Environment do VPS.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TF_VAR_db_admin_password}" ]; then
            echo "::error::Defina o Repository secret TF_VAR_db_admin_password."
            missing=1
          fi
          if [ -z "${AZURE_CLIENT_ID}" ] || [ -z "${AZURE_TENANT_ID}" ] || [ -z "${AZURE_SUBSCRIPTION_ID}" ]; then
            echo "::error::Defina AZURE_CLIENT_ID, AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID como Repository secrets (nao no Environment TAILSCALE_AUTHKEY)."
            echo "GitHub → Settings → Secrets and variables → Actions → Repository secrets"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Secrets OIDC e senha Postgres presentes."

      - name: Definir stack analitica
        run: |
          if [ -n "${{ secrets.TF_VAR_enable_analytics_stack }}" ]; then
            echo "TF_VAR_enable_analytics_stack=${{ secrets.TF_VAR_enable_analytics_stack }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TF_VAR_enable_analytics_stack=${{ github.event.inputs.enable_analytics_stack }}" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_enable_analytics_stack=true" >> "$GITHUB_ENV"
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
