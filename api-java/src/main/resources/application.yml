spring:
  application:
    name: fraud-detection-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

fraud:
  model:
    path: ${MODEL_PATH:models/fraud_model.pkl}
  threshold: ${FRAUD_THRESHOLD:0.7}

logging:
  level:
    root: INFO
    com.fraud: DEBUG
